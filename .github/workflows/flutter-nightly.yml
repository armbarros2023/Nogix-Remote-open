name: Flutter Nightly Build

on:
  schedule:
    # schedule build every night
    - cron: "0 0 * * *"
  workflow_dispatch:

# New repositories give workflows a read-only token; the build publishes releases and the SBOM.
permissions:
  contents: write

jobs:
  run-flutter-nightly-build:
    # Forks such as Nogix Remote build only on demand, not every night.
    if: ${{ github.repository == 'rustdesk/rustdesk' || github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: "nightly"
